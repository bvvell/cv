<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Base HTML template used by Vite in dev and as the entry for the built app.
      Why: most SEO tags are set dynamically via `@unhead/vue` (see `src/composables/useSiteHead.ts`),
      but these base tags cover basic rendering and theming.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffaf2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f13" />
    <meta name="robots" content="index,follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Search Console ownership. The first token belongs to the retired
         bvvell.ru property: Google re-checks it through the 301 to this site, so
         it must stay until the Change of Address is done. The second is
         bvvell.site itself. -->
    <meta name="google-site-verification" content="AoFDpgGYt2iOkLo2i51M0ONYRG38dOY3hAw4U0XBThc" />
    <meta name="google-site-verification" content="LmwqcjQpD0bjomH-e4UN9_wAS_AKZOA38gSoRgrW-Pk" />
    <meta name="description" content="UI engineer / front-end developer. CV, links, and short posts." />
    <meta name="keywords" content="UI engineer, front-end developer, Vue, TypeScript" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preload" href="/av.png" as="image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Нататкі — Uladzimir Biarnatski" href="/feed.xml" />
    <link rel="alternate" type="application/rss+xml" title="Заметки — Uladzimir Biarnatski" href="/feed.ru.xml" />
    <link rel="preconnect" href="https://cloud.umami.is" crossorigin />
    <link rel="dns-prefetch" href="https://cloud.umami.is" />
    <title>Uladzimir Biarnatski — UI Engineer / Front-end Developer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!--
      Analytics: loaded after HTML to avoid blocking initial render.
      Why `data-auto-pageview="false"`: the tracker reports the raw initial URL, so
      `/cv` was counted before the router normalized it to `/cv/` — one visit, two
      pageviews. `src/main.ts` reports pageviews after navigation settles instead.
      Why `data-performance="true"`: collects Core Web Vitals (LCP/INP/CLS/FCP/TTFB)
      from real visits, which the dashboard shows alongside pageviews.
    -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="60cf839b-abb5-4aa1-ac5e-687f15ea8a3e" data-domains="bvvell.site,www.bvvell.site" data-auto-pageview="false" data-performance="true"></script>
  </body>
</html>
