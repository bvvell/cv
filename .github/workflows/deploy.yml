name: Verify and deploy bvvell.site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  SITE_URL: https://bvvell.site

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bvvell.site

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10.28.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for PDF export
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Lint
        run: pnpm run lint

      - name: Verify posts index is up to date
        run: |
          node scripts/generate-posts-index.mjs
          git diff --exit-code -- src/modules/posts/posts-index.json

      - name: Build the site
        run: pnpm run build
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}

      - name: Generate CV PDF (A4)
        run: pnpm run cv:pdf

      - name: Generate deployment metadata
        run: pnpm run deploy:metadata

      - name: Check deployment configuration
        id: deployment
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        run: |
          if [ -n "$SFTP_HOST" ] &&
             [ -n "$SFTP_PORT" ] &&
             [ -n "$SFTP_USER" ] &&
             [ -n "$SFTP_PASSWORD" ] &&
             [ -n "$SFTP_TARGET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped until all production SFTP secrets are configured."
          fi

      - name: Upload dist via SFTP
        if: steps.deployment.outputs.ready == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          # `dist` and not `dist/*`: the glob skips dotfiles, and `.htaccess`
          # carries the trailing-slash rules and the SSG rewrites.
          source: "dist"
          target: ${{ secrets.SFTP_TARGET }}
          strip_components: 1
          overwrite: true

      - name: Remove old hashed assets
        if: steps.deployment.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        env:
          SFTP_TARGET: ${{ secrets.SFTP_TARGET }}
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          envs: SFTP_TARGET
          # The upload overwrites but never deletes, so every build leaves its
          # hashed assets behind. Two weeks keeps the previous deploys loadable
          # for anyone holding an open tab.
          script: |
            set -e
            case "$SFTP_TARGET" in
              ""|"/"|"."|".."|../*|*/../*|*/..)
                echo "Refusing to clean an unsafe target."
                exit 1
                ;;
            esac
            TARGET_DIR="${SFTP_TARGET%/}"
            ASSET_DIR="$TARGET_DIR/assets"
            if [ ! -f "$TARGET_DIR/index.html" ] || [ ! -d "$ASSET_DIR" ]; then
              echo "Refusing to clean a target without the deployed site."
              exit 1
            fi
            find "$ASSET_DIR" -type f -mtime +14 -delete

      - name: Verify the deployed site
        if: steps.deployment.outputs.ready == 'true'
        run: pnpm run deploy:check
